services:
  api:
    build: { context: ., dockerfile: deployment/docker/Dockerfile }
    ports: ["8000:8000"]
    environment:
      ATLAS_API_KEYS: ${ATLAS_API_KEYS:-dev-key:admin,analyst-key:analyst}
      ATLAS_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/app/data/state"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  redis-data:
