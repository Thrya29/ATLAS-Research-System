[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-router"
version = "1.0.0"
description = "ATLAS: adaptive, cost- and reliability-constrained tool routing for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "prometheus-client>=0.19",
  "redis>=5.0",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.8"]
langchain = ["langchain-core>=0.3", "langgraph>=0.2"]
llm = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.package-data]
atlas = ["api/static/*.html"]

[tool.setuptools.packages.find]
include = ["atlas*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E702", "B023"]

[tool.ruff.lint.per-file-ignores]
# Keyword regexes and markdown table rows read better unwrapped.
"benchmarks/**" = ["E501"]
