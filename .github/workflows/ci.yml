name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev,langchain]"
      - run: ruff check .
      - run: pytest -q
      - name: Reproducibility smoke (quick experiment pass)
        run: python -m benchmarks.experiments.run_all --quick --only E1 --workers 2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deployment/docker/Dockerfile -t atlas:ci .
      - name: Container smoke test
        run: |
          docker run -d --name atlas -p 8000:8000 -e ATLAS_API_KEYS=k:admin atlas:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 2; done
          curl -sf -X POST localhost:8000/v1/execute -H 'X-API-Key: k' -H 'Content-Type: application/json' \
            -d '{"query":"Calculate the percentage change in revenue between Q1 and Q2"}' | tee /dev/stderr | grep -q numeric_result
